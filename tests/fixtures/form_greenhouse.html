<!DOCTYPE html>
<html>
  <body>
    <form id="application_form">
      <label for="first_name">First Name *</label>
      <input id="first_name" name="job_application[first_name]" type="text" required />

      <label for="last_name">Last Name *</label>
      <input id="last_name" name="job_application[last_name]" type="text" required />

      <label for="email">Email *</label>
      <input id="email" name="job_application[email]" type="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel" />

      <label for="resume">Resume/CV *</label>
      <input id="resume" name="resume" type="file" required />

      <label for="ctc">Expected CTC (LPA) *</label>
      <input id="ctc" name="expected_ctc" type="text" required />

      <label for="notice">Notice period (days) *</label>
      <input id="notice" name="notice_period" type="text" required />

      <label for="why">Why do you want to join Acme?</label>
      <textarea id="why" name="why_company"></textarea>

      <button type="submit" id="submit_app">Submit Application</button>
    </form>
  </body>
</html>
