<!DOCTYPE html>
<html>
  <body>
    <form class="application-form">
      <label>Full Name <input name="name" type="text" required /></label>
      <label>Email <input name="email" type="email" required /></label>
      <label>Resume <input name="resume" type="file" required /></label>
      <label>LinkedIn URL <input name="urls[LinkedIn]" type="url" /></label>
      <label>GitHub URL <input name="urls[GitHub]" type="url" /></label>
      <textarea name="comments" placeholder="Additional information"></textarea>
      <button type="submit" class="postings-btn">Submit application</button>
    </form>
  </body>
</html>
