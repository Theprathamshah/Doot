[project]
name = "doot"
version = "0.1.0"
description = "Local-first Job Search Triage, RAG-Grounded Tailoring, MCP Server, and Assisted-Apply agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.3",
    "ddgs>=7.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "mcp>=1.0.0",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "starlette>=0.40.0",
    "tenacity>=8.2.3",
    "typer>=0.12.3",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
jobspy = [
    "python-jobspy>=1.1.75",
]

[project.scripts]
doot = "doot.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.1",
    "ruff>=0.4.4",
    "types-beautifulsoup4>=4.12.0.20240511",
    "types-pyyaml>=6.0.12.20240311",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["doot"]
mypy_path = "src"
